<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C0A;--ac:#D8B26E;--mix:#fff;--tx:#ECE8DF;
  --s1:color-mix(in srgb,var(--bg) 93%,var(--mix));
  --s2:color-mix(in srgb,var(--bg) 87%,var(--mix));
  --ln:color-mix(in srgb,var(--bg) 84%,var(--mix));
  --ln2:color-mix(in srgb,var(--bg) 70%,var(--mix));
  --mu:color-mix(in srgb,var(--tx) 60%,var(--bg));
  --acd:color-mix(in srgb,var(--ac) 14%,var(--bg));
  --glow:color-mix(in srgb,var(--ac) 45%,transparent);
  --card:color-mix(in srgb,var(--bg) 91%,var(--mix));
  --onac:var(--bg);
  --ok:#8FB86A;--wr:#E0A03C;--cr:#E5604A;
  --fd:'Readex Pro','IBM Plex Sans Arabic',sans-serif;--fb:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --rail:252px;--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),radial-gradient(700px 500px at 0% 105%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:400 1rem/1.8 var(--fb);min-height:100vh;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--ac);color:var(--onac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
/* ---- rail ---- */
.rail{width:var(--rail);flex:none;position:sticky;top:12px;margin:12px;height:calc(100vh - 24px);border:1px solid var(--ln);border-radius:24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;padding:20px 12px 12px;z-index:30;box-shadow:0 20px 50px -30px #000}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid var(--ln)}
.mark{width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,var(--bg)));color:var(--onac);display:grid;place-items:center;font:700 1.4rem var(--fd);box-shadow:0 8px 22px -8px var(--glow)}
.brand b{font:700 1.05rem/1.25 var(--fd);display:block}
.brand small{color:var(--mu);font-size:.76rem}
.rail nav{flex:1;overflow-y:auto;padding:14px 0;scrollbar-width:thin;display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--mu);text-align:start;font-size:.93rem;transition:color .15s,background .15s}
.rail nav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail nav button:hover{color:var(--tx);background:var(--s2)}
.rail nav button.on{color:var(--ac);background:var(--acd);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent)}
.rtools{border-top:1px solid var(--ln);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rtools .wide{grid-column:1/-1}
.tb{border:1px solid var(--ln2);border-radius:12px;background:none;padding:8px 10px;cursor:pointer;text-align:center;text-decoration:none;font-size:.83rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,color .15s,background .15s}
.tb:hover{border-color:var(--ac);color:var(--ac);background:var(--acd)}
.tb.dc{background:#5865F2;border-color:#5865F2;color:#fff}.tb.dc:hover{color:#fff;filter:brightness(1.1);background:#5865F2}
.live{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.8rem;padding:0 8px 10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.topbar{display:none}
/* ---- main ---- */
.stage{flex:1;min-width:0}
main{max-width:1040px;margin:auto;padding:12px clamp(16px,3.5vw,40px) 70px}
.view{display:none}.view.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vh{padding:40px 0 22px;margin-bottom:26px;position:relative}
.vh::after{content:'';position:absolute;inset-inline-start:0;bottom:0;width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ac),transparent)}
.vh h2{font:700 clamp(1.8rem,4vw,2.6rem)/1.2 var(--fd)}
.vh p{color:var(--mu);max-width:56ch;margin-top:6px}
/* hero */
.hero{position:relative;margin-top:14px;padding:clamp(30px,6vw,68px);border:1px solid var(--ln);border-radius:30px;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card) 55%)}
.hero::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;inset-inline-end:-120px;top:-160px;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(10px);pointer-events:none}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--tx) 14%,transparent) 1px,transparent 1.5px);background-size:22px 22px;mask-image:linear-gradient(160deg,transparent 30%,#000 100%);-webkit-mask-image:linear-gradient(160deg,transparent 30%,#000 100%);opacity:.5;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font:700 clamp(2.6rem,9vw,6rem)/1.08 var(--fd);max-width:13ch;overflow-wrap:anywhere;background:linear-gradient(180deg,var(--tx) 35%,color-mix(in srgb,var(--tx) 40%,var(--ac)));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero .tg{font-size:clamp(1.05rem,2.2vw,1.4rem);color:var(--mu);max-width:36ch;margin:18px 0 28px}
.hero .go{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:600;padding:11px 24px;border-radius:14px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,var(--bg)));color:var(--onac);text-decoration:none;box-shadow:0 10px 26px -12px var(--glow);transition:filter .15s,transform .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 14px 30px -12px var(--glow)}.btn:active{transform:translateY(1px)}
.btn.gh{background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.btn.gh:hover{box-shadow:inset 0 0 0 1px var(--ac);color:var(--ac)}
.btn.sm{padding:6px 14px;font-size:.85rem;border-radius:10px}
.btn.dg{background:var(--cr);color:#fff;box-shadow:none}
.clock{position:absolute;top:26px;inset-inline-end:30px;text-align:end;font:500 .9rem var(--fd);color:var(--mu);z-index:2}
.clock b{display:block;font:700 2rem/1.1 var(--fd);color:var(--tx);font-variant-numeric:tabular-nums}
.ledger{margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ledger div{display:flex;flex-direction:column-reverse;gap:2px;padding:18px 20px;border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:16px;background:var(--card)}
.ledger span{color:var(--mu);font-size:.88rem}
.ledger i{display:none}
.ledger b{font:700 2.3rem/1.15 var(--fd);color:var(--ac)}
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;gap:12px;margin-top:16px}
.mosaic div{background:var(--card);border:1px dashed var(--ln2);border-radius:var(--r);display:grid;place-items:center;color:var(--mu);font-size:.85rem;overflow:hidden}
.mosaic div:has(img){border:1px solid var(--ln)}
.mosaic div:first-child{grid-row:span 2}
.mosaic div:nth-child(4){grid-column:2/4}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mosaic div:hover img{transform:scale(1.06)}
/* generic cards */
.lead{font-size:clamp(1.1rem,2.3vw,1.45rem);line-height:1.9;max-width:52ch;margin-bottom:28px}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rows>div{padding:24px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);transition:transform .2s,border-color .2s}
.rows>div:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 50%,var(--ln))}
.rows h3{font:700 1.2rem var(--fd);color:var(--ac);margin-bottom:6px}
.rows p{color:var(--mu)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.paths>div{padding:26px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card)}
.paths h3{font:700 1.3rem var(--fd);margin-bottom:4px}
.paths p{color:var(--mu);margin-bottom:16px}
.ladder{list-style:none;position:relative;padding-inline-start:28px}
.ladder::before{content:'';position:absolute;inset-block:12px;inset-inline-start:7px;width:2px;background:linear-gradient(var(--ac),var(--ln2))}
.ladder li{position:relative;padding:5px 0}
.ladder li::before{content:'';position:absolute;inset-inline-start:-27px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac)}
.ladder li:first-child::before{background:var(--ac);box-shadow:0 0 0 4px var(--acd)}
.fto{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.fto>div{padding:26px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);position:relative;overflow:hidden}
.fto .n{font:700 5rem/1 var(--fd);color:var(--acd);position:absolute;top:-4px;inset-inline-end:16px}
.fto h3{font:700 1.25rem var(--fd);margin-bottom:2px;position:relative}
.fto small{color:var(--ac);font-weight:500;position:relative}
.fto p{color:var(--mu);margin-top:12px;position:relative}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.search{flex:1 1 220px;background:var(--card);border:1px solid var(--ln2);border-radius:14px;padding:11px 16px;outline:0}
.search:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acd)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:none;border:1px solid var(--ln2);border-radius:99px;padding:5px 15px;cursor:pointer;color:var(--mu);font-size:.85rem;transition:all .15s}
.chips button:hover{border-color:var(--ac);color:var(--ac)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
/* rules */
.acc{border:1px solid var(--ln);border-radius:var(--r);background:var(--card);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.acc:hover,.acc.open{border-color:color-mix(in srgb,var(--c) 55%,var(--ln))}
.acc>button{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;padding:14px 16px;cursor:pointer;text-align:start;font-weight:500;font-size:1.03rem}
.acc .dg{flex:none;min-width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:var(--bg);font:700 1rem var(--fd)}
.acc .ch{margin-inline-start:auto;transition:transform .25s;color:var(--mu)}
.acc.open .ch{transform:rotate(180deg)}
.acc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.acc.open .bd{grid-template-rows:1fr}
.acc .bd>div{overflow:hidden;color:var(--mu);padding-inline:68px 16px}
.acc.open .bd>div{padding-bottom:18px}
/* sop */
.sop{display:grid;grid-template-columns:230px 1fr;gap:20px}
.side{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);align-self:start}
.side button{background:none;border:0;border-radius:11px;padding:11px 14px;text-align:start;cursor:pointer;color:var(--mu);transition:all .15s}
.side button:hover{color:var(--tx);background:var(--s2)}
.side button.on{color:var(--ac);background:var(--acd)}
.doc{padding:26px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card)}
.doc h3{font:700 1.5rem var(--fd);margin-bottom:12px}
.doc ul{padding-inline-start:22px}.doc li{padding:5px 0;color:var(--mu)}.doc li::marker{color:var(--ac)}
/* tables */
.tw{overflow:auto;border:1px solid var(--ln);border-radius:var(--r);max-height:540px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{position:sticky;top:0;background:var(--s2);text-align:start;padding:12px 18px;font-weight:600;color:var(--ac);border-bottom:1px solid var(--ln2)}
td{padding:12px 18px;border-top:1px solid var(--ln)}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--s2)}
.pill{padding:2px 12px;font-size:.78rem;border:1px solid currentColor;border-radius:99px;background:color-mix(in srgb,currentColor 10%,transparent)}
.pill.on{color:var(--ok)}.pill.off{color:var(--cr)}.pill.lv{color:var(--wr)}
.perm{display:inline-block;margin:3px 0;margin-inline:0 6px;padding:2px 12px;background:var(--acd);border-radius:99px;font-size:.82rem}
/* ---- military roster ---- */
.milnote{margin-bottom:14px;padding:16px 20px;border:1px solid var(--ln);border-inline-start:4px solid var(--ac);border-radius:0 var(--r) var(--r) 0;background:linear-gradient(100deg,var(--acd),color-mix(in srgb,var(--card) 88%,transparent) 70%);position:relative}
.milnote h4{font:700 1.05rem/1.5 var(--fd);color:var(--ac);margin-bottom:4px}
.milnote p{color:var(--mu);font-size:.92rem;line-height:1.9}
.milnote .lg{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--ln2);font-size:.8rem;color:var(--mu)}
.milnote .lg span{display:inline-flex;align-items:center;gap:6px}
.milnote .lg i{width:9px;height:9px;border-radius:2px;background:var(--ok);display:inline-block}
.milnote .lg i.off{background:var(--cr)}.milnote .lg i.lv{background:var(--wr)}
.tw.mil{border-color:var(--ln2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 12%,transparent),0 18px 40px -32px #000}
.tw.mil table{min-width:620px}
.tw.mil th{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 12%,var(--s2)),var(--s2));letter-spacing:.1em;font-size:.74rem}
.tw.mil td{vertical-align:middle;padding:11px 16px}
.tw.mil caption{caption-side:top;text-align:start;padding:12px 16px;font:600 .76rem var(--fd);letter-spacing:.16em;color:var(--ac);border-bottom:1px solid var(--ln2);background:color-mix(in srgb,var(--ac) 7%,transparent)}
.mil-name{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mil-name .av{width:32px;height:32px;font-size:.85rem}
.mil-code{font:600 .84rem/1 var(--fd);letter-spacing:.08em;color:var(--ac);direction:ltr;white-space:nowrap}
.tw.mil td .pill{border-radius:6px;font-size:.74rem;letter-spacing:.02em}
.ins{display:inline-flex;align-items:center;justify-content:center;min-width:78px;padding:5px 10px;border:1px solid var(--ln2);border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 10%,transparent),transparent);color:var(--ac);font:700 .95rem/1 var(--fd);letter-spacing:2px;white-space:nowrap}
.ins small{font-size:.62rem;letter-spacing:0;color:var(--mu);margin-inline-start:6px}
.milgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:12px}
.mcard{border:1px solid var(--ln);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--tx) 6%,transparent),0 18px 40px -32px #000;transition:transform .25s,border-color .25s}
.mcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 55%,var(--ln))}
.mcard .ph{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--ln);background:radial-gradient(circle at 50% 35%,var(--acd),var(--s2))}
.mcard .ph.adm{cursor:pointer}
.mcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mcard:hover .ph img{transform:scale(1.05)}
.mcard .ph .ins{min-width:auto;padding:10px 20px;border:0;background:none;font-size:2.1rem;border-radius:0}
.mcard .bd{padding:14px 16px}
.mcard .bd h4{font:700 1.1rem/1.4 var(--fd);color:var(--tx)}
.mcard .bd .rk{color:var(--ac);font-size:.9rem;margin-top:2px}
.mcard .bd .ml{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--ln2)}
.simg{width:100%;border:1px solid var(--ln);border-radius:var(--r);margin-bottom:18px;display:none}
.mg h3{font:700 1.25rem var(--fd);margin:26px 0 12px}
.mi{display:flex;gap:16px;align-items:center;padding:10px;margin-bottom:10px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card)}
.mi .th{width:120px;aspect-ratio:16/10;background:var(--s2);border-radius:12px;flex:none;display:grid;place-items:center;color:var(--ac);overflow:hidden}
.mi .th img{width:100%;height:100%;object-fit:cover}
.mi b{flex:1;font-weight:500}
.cr{list-style:none;display:grid;gap:10px}
.cr li{display:flex;gap:12px;padding:14px 18px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);align-items:baseline}
.cr i{flex:1;border-bottom:2px dotted var(--ln2)}.cr span{color:var(--mu)}
/* forms */
form{display:grid;gap:16px;max-width:560px}
label{display:grid;gap:6px;color:var(--mu);font-size:.9rem}
input,select,textarea{background:var(--card);border:1px solid var(--ln2);border-radius:12px;padding:11px 14px;outline:0;width:100%;color:var(--tx);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acd)}
textarea{min-height:100px;resize:vertical}
input[type=color]{padding:3px;height:42px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
#out{white-space:pre-wrap;background:var(--card);border:1px solid var(--ln);border-inline-start:4px solid var(--ac);border-radius:14px;padding:16px;margin-top:18px;display:none;max-width:560px}
/* modal / overlays */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 65%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;place-items:center;z-index:80;padding:16px}
.modal.on{display:grid}
.mb{background:var(--s1);border:1px solid var(--ln2);border-radius:24px;max-width:460px;width:100%;padding:28px;box-shadow:0 30px 80px -30px #000,0 0 0 1px color-mix(in srgb,var(--ac) 18%,transparent);animation:in .3s ease}
.mb h3{font:700 1.35rem var(--fd);margin-bottom:8px}
.mb p{color:var(--mu);margin-bottom:14px}
.mb .acts{display:flex;gap:8px;margin-top:16px}
.err{color:var(--cr);font-size:.85rem;display:none;margin-top:8px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.sw button{width:38px;height:38px;border:2px solid var(--ln2);border-radius:50%;cursor:pointer;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);transition:transform .15s}
.sw button:hover{border-color:var(--tx);transform:scale(1.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#boot,#gate{position:fixed;inset:0;background:radial-gradient(500px 360px at 50% 40%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%),var(--bg);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,visibility .5s;padding:20px;text-align:center}
#boot.off,#gate.off{opacity:0;visibility:hidden}
#boot svg{width:84px;height:84px;filter:drop-shadow(0 0 14px var(--glow))}
#boot path{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:320;stroke-dashoffset:320;animation:dr 1.3s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#boot h1,#gate h1{font:700 1.6rem var(--fd)}
.bar{width:180px;height:4px;border-radius:4px;overflow:hidden;background:var(--ln)}.bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--ac);animation:ld 1.5s ease forwards}
@keyframes ld{to{width:100%}}
#gate{z-index:98;display:none}#gate.on{display:flex}
#gate form{max-width:320px;width:100%}
footer{border-top:1px solid var(--ln);padding:22px 4px 0;color:var(--mu);font-size:.85rem;margin-top:50px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* admin */

function readImg(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)}

function vid(u){u=(u||'').trim();if(!u)return'';let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);

  const web=/^https?:/i.test(u);
  if(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(u)&&(web||/^[\w.\/%-]+$/.test(u)))return `<video controls playsinline preload="metadata" src="${esc(u)}"></video>`;

  if(b.type==='text'){const k=L(b.k),bl=L(b.bl),u=/^https?:/i.test(b.url||'')?b.url:'';

    return `<div class="blk expl${side?' has':''}"><div class="ex">${k?`<span class="nd">${esc(k)}</span>`:''}${h}<p>${nl(L(b.d))}</p>${bl&&u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(bl)}</a>`:''}</div>${side}</div>`}
  if(b.type==='video')return `<div class="blk">${h}<div class="vid">${vid(b.url)}</div></div>`;
  if(b.type==='images')return `<div class="blk">${h}<div class="gal">${im.map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div></div>`;
  if(b.type==='table'){const r=L(b.rows).split('\n').filter(Boolean).map(l=>l.split('|').map(c=>c.trim()));
    return `<div class="blk">${h}${r.length?`<div class="tw"><table><thead><tr>${r[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.slice(1).map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}</div>`}
  if(b.type==='news')return `<article class="blk news">${im[0]?`<img src="${esc(im[0])}" alt="">`:''}<div>${b.date?`<span class="nd">${esc(b.date)}</span>`:''}${h}<p>${nl(L(b.d))}</p></div></article>`;
  return''}

  listEd($('#e_access'),C.access,[{k:'role',l:t('p_role'),t:'i'},{k:'perms',l:t('p_perms'),t:'A'}],()=>({role:B('دور','Role'),perms:B('صلاحية','Permission')}));
  if(!C.joinQs)C.joinQs=[];listEd($('#e_jq'),C.joinQs,[{k:'t',l:t('p_q'),t:'i'},{k:'k',l:t('p_kind'),t:'s',o:[['text',t('qt_text')],['long',t('qt_long')],['number',t('qt_num')],['choice',t('qt_choice')]]},{k:'o',l:t('p_opts'),t:'A'},{k:'req',l:t('p_req'),t:'s',o:[['1',t('q_yes')],['0',t('q_no')]]}],()=>({t:B('سؤال جديد','New question'),k:'text',o:B('',''),req:'1'}));
  listEd($('#e_sch'),C.schedule.rows,[{k:'name',l:t('p_nm'),t:'p'},{k:'rank',l:t('p_rank'),t:'i'},{k:'code',l:t('p_code'),t:'p'},{k:'st',l:t('p_st'),t:'s',o:[['on',t('on')],['off',t('off')],['lv',t('lv')]]},{k:'ins',l:t('p_ins'),t:'p'},{k:'insUrl',l:t('p_insUrl'),t:'p'},{k:'insFile',l:t('a_img'),t:'f'},{k:'insFile',l:t('a_bgRm'),t:'c'}],()=>({name:'Name',rank:B('عضو','Member'),code:'PSF-000',st:'on',ins:'',insUrl:'',insFile:''}));
  const sn=$('#schNoteIn');sn.value=L(C.schedule.note||'');sn.oninput=()=>{setI(C.schedule,'note',sn.value);commit()};
  listEd($('#e_crew'),C.crew,[{k:'name',l:t('p_nm'),t:'p'},{k:'rank',l:t('p_rank'),t:'i'},{k:'code',l:t('p_code'),t:'p'},{k:'st',l:t('p_st'),t:'s',o:[['on',t('on')],['off',t('off')],['lv',t('lv')]]},{k:'img',l:t('a_img'),t:'f'},{k:'img',l:t('a_bgRm'),t:'c'},{k:'ins',l:t('p_ins'),t:'p'},{k:'joined',l:t('p_joined'),t:'p'},{k:'did',l:t('p_did'),t:'p'},{k:'warns',l:t('p_warns'),t:'P'},{k:'notes',l:t('p_notes'),t:'P'}],()=>({name:'Name',rank:B('عضو','Member'),code:'PSF-000',st:'on',img:'',ins:'',joined:'',did:'',warns:'',notes:''}));
  const cn=$('#crewNoteIn');cn.value=L(C.crewNote||'');cn.oninput=()=>{setI(C,'crewNote',cn.value);commit()};
  listEd($('#e_media'),C.media,[{k:'t',l:t('p_t'),t:'i'},{k:'kind',l:t('p_kind'),t:'s',o:[['stream',t('p_stream')],['archive',t('p_arch')]]},{k:'url',l:t('p_url'),t:'p'},{k:'img',l:t('a_img'),t:'f'}],()=>({t:B('عنوان','Title'),kind:'stream',url:'',img:''}));
  listEd($('#e_cred'),C.credits,[{k:'name',l:t('p_nm'),t:'p'},{k:'role',l:t('p_role'),t:'i'}],()=>({name:'Name',role:B('دور','Role')}));
  $('#bgFile').onchange=e=>{const f=e.target.files[0];if(f)readImg(f,1920,u=>{C.bg.img=u;commit()})};
  $('#bgClr').onclick=()=>{C.bg.img='';commit()};
  $('#bgDim').value=C.bg.dim;$('#bgDim').oninput=e=>{C.bg.dim=+e.target.value;commit()};
  $('#galT').innerHTML=[0,1,2,3].map(i=>`<label class="btn gh sm fbtn" style="display:inline-flex;width:auto;color:var(--tx)">${C.gallery[i]?'✓ ':''}${t('a_img')} ${i+1}<input type="file" accept="image/*" data-g="${i}"></label>`).join('');
  $$('#galT input').forEach(inp=>inp.onchange=e=>{const f=e.target.files[0];if(f)readImg(f,1000,u=>{C.gallery[+inp.dataset.g]=u;commit();drawAdmin()})});
  $('#dAc').value=C.theme.accent;$('#dBg').value=C.theme.bg;
  $('#dAc').oninput=e=>{C.theme.accent=e.target.value;save()};$('#dBg').oninput=e=>{C.theme.bg=e.target.value;save()};
  $('#setCode').onclick=async()=>{const v=$('#newCode').value;if(v.length<4){alert(t('a_codeShort'));return}C.adminHash=await sha(v);save();$('#newCode').value='';alert(t('a_codeDone'))};
  $('#gateOn').checked=C.gate.on;$('#gateOn').onchange=e=>{C.gate.on=e.target.checked;save()};
  $('#setGate').onclick=async()=>{const v=$('#gateCode').value;if(v.length<4){alert(t('a_codeShort'));return}C.gate.hash=await sha(v);save();$('#gateCode').value='';alert(t('a_codeDone'))};
  $('#exCopy').onclick=async()=>{$('#ex').value=JSON.stringify(C);try{await navigator.clipboard.writeText($('#ex').value);$('#exCopy').textContent=t('copied')}catch(_){$('#ex').select()}};
  $('#imp').onclick=()=>{try{C=Object.assign(clone(CONFIG),JSON.parse($('#ex').value));commit();drawAdmin()}catch(_){alert(t('a_bad'))}};
  $('#rst').onclick=()=>{if(confirm(t('a_rstQ'))){try{localStorage.removeItem(KEY)}catch(_){}C=clone(CONFIG);renderAll();drawAdmin()}};
}
/* ---- Discord login (client-side OAuth, identify only) ---- */
const RET=location.hash.startsWith('#access_token=')||location.hash.startsWith('#error=')?location.hash.slice(1):null;
if(RET)history.replaceState(null,'',location.pathname+location.search);
const DKEY='portal_discord';let DU=null;try{DU=JSON.parse(localStorage.getItem(DKEY)||'null')}catch(_){}
function dlLabel(){const b=$('#dlBtn');if(!b)return;b.innerHTML=DU?`<img src="${esc(DU.av)}" alt="" style="width:20px;height:20px;border-radius:50%"> ${esc(DU.name)} · ${esc(t('dl_out'))}`:'🎮 '+esc(t('dl_in'))}
function fillJoin(){const j=$('#j2');if(j&&DU&&!j.value)j.value=DU.user}
const _dj=drawJoin;drawJoin=function(){_dj();fillJoin()};
async function dlFinish(h){const p=new URLSearchParams(h);
  try{if(!p.get('access_token')||p.get('state')!==sessionStorage.getItem('dl_state'))throw 0;
    const r=await fetch('https://discord.com/api/users/@me',{headers:{Authorization:'Bearer '+p.get('access_token')}});if(!r.ok)throw 0;const u=await r.json();
    DU={id:u.id,name:u.global_name||u.username,user:u.username,av:u.avatar?`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=64`:'https://cdn.discordapp.com/embed/avatars/0.png'};
    localStorage.setItem(DKEY,JSON.stringify(DU))}catch(_){if(!p.get('error')||p.get('error')!=='access_denied')alert(t('dl_err'))}
  dlLabel();drawJoin();go(sessionStorage.getItem('dl_back')||'hub')}
$('#dlBtn').onclick=()=>{
  if(DU){DU=null;try{localStorage.removeItem(DKEY)}catch(_){}dlLabel();drawJoin();return}
  const id=(C.dcClientId||'').trim();if(!id){alert(t('dl_noid'));return}
  const st=[...crypto.getRandomValues(new Uint32Array(4))].join('-');
  try{sessionStorage.setItem('dl_state',st);sessionStorage.setItem('dl_back',location.hash.slice(1)||'hub')}catch(_){}
  location.href='https://discord.com/oauth2/authorize?client_id='+encodeURIComponent(id)+'&response_type=token&scope=identify&prompt=none&state='+st+'&redirect_uri='+encodeURIComponent(location.origin+location.pathname)};
/* ---- start ---- */
applyTheme();renderAll();tick();
try{if(sessionStorage.getItem('adm')){admin=true;applyLang();drawAdmin();drawNav();drawBlocks();drawCrew();drawJoin()}}catch(_){}
gateCheck();
if(RET)dlFinish(RET);
setTimeout(()=>{$('#boot').classList.add('off');go(location.hash.slice(1)||'hub')},1700);
</script>

<script>
(function(){
const URL_='',KEY_='';/* ← ضع هنا رابط مشروع Supabase والمفتاح العام (anon) */
const R={trainee:'متدرب',member:'عضو',officer:'ضابط',command:'قيادة'};
const K={report:'التقارير',case:'القضايا',leave:'الإجازات',note:'ملاحظاتي',review:'المراجعة',members:'الأعضاء',att:'الحضور',admin:'الإدارة'}
const AT={'':'غير مسجل',present:'حاضر',late:'متأخر',absent:'غائب',excused:'معذور'};;
const KS={report:'تقرير',case:'قضية',leave:'طلب إجازة',note:'ملاحظة'};
const S={pending:'قيد المراجعة',submitted:'مرفوع',open:'مفتوحة',private:'خاصة',approved:'موافق عليها',rejected:'مرفوضة',reviewed:'تمت المراجعة',closed:'مغلقة'};
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const em=u=>u+'@users.psf-portal.com';
const er=e=>{const m=(e&&e.message)||'';return /Invalid login/i.test(m)?'اسم المستخدم أو كلمة المرور غلط.':/already registered/i.test(m)?'هذا الاسم مستخدم.':/at least|password/i.test(m)?'كلمة المرور لازم 8 أحرف على الأقل.':m||'صار خطأ، جرّب مرة ثانية.'};
let sb=null;try{if(URL_&&KEY_&&window.supabase)sb=window.supabase.createClient(URL_,KEY_)}catch(_){}
let mem={e:[{id:900,user_id:'a',kind:'leave',title:'إجازة عائلية',body:'سفر مع العائلة.',status:'pending',start_date:'2026-12-01',end_date:'2026-12-05',created_at:new Date().toISOString()}],m:[{id:'d',username:'demo',rank:'command',status:'active'},{id:'a',username:'alpha',rank:'member',status:'active'},{id:'e',username:'echo',rank:'trainee',status:'pending'}]},user=false,n=1000;
try{const s=JSON.parse(localStorage.getItem('psf_demo'));if(s){mem=s;n=Math.max(1000,...mem.e.map(x=>x.id+1))}}catch(_){}
const sv=()=>{try{localStorage.setItem('psf_demo',JSON.stringify(mem))}catch(_){}};
const L={
 async me(){return user?mem.m[0]:null},
 async login(){user=true},
 async signup(){throw new Error('التسجيل الجديد يشتغل بعد ربط Supabase.')},
 async out(){user=false},
 async list(f){return mem.e.filter(x=>(!f.kind||x.kind===f.kind)&&(!f.uid||x.user_id===f.uid)&&(!f.not||x.user_id!==f.not)&&(!f.st||f.st.includes(x.status))).map(x=>({...x,profiles:mem.m.find(m=>m.id===x.user_id)})).reverse()},
 async add(r){const st={leave:'pending',case:'open',note:'private'}[r.kind]||'submitted';mem.e.push({...r,id:n++,user_id:'d',status:st,created_at:new Date().toISOString()});sv()},
 async upd(id,p){Object.assign(mem.e.find(x=>x.id===id),p);sv()},
 async del(id){mem.e=mem.e.filter(x=>x.id!==id);sv()},
 async members(){return mem.m},
 async setM(id,rk,st){Object.assign(mem.m.find(m=>m.id===id),{rank:rk,status:st});sv()}};
mem.att=mem.att||[{id:1,title:'تدريب جماعي',date:'2026-11-14',kind:'تدريب',marks:{a:'present',e:'absent',d:'present'}},{id:2,title:'دورية',date:'2026-11-18',kind:'دورية',marks:{a:'late',e:'present',d:'present'}}];
mem.log=mem.log||[{t:new Date().toISOString(),who:'demo',act:'فتح البوابة'}];
if(!mem.e.some(x=>x.id===901))mem.e.push({id:901,user_id:'a',kind:'note',title:'ملاحظة تدريب',body:'أحتاج وقت أكثر على الاتصال اللاسلكي.',status:'private',created_at:new Date().toISOString()});
const lg=a=>{mem.log.unshift({t:new Date().toISOString(),who:'demo',act:a});mem.log.length=Math.min(mem.log.length,60)};
const wrap=(k,f)=>{const o=L[k];L[k]=async(...a)=>{const r=await o(...a);lg(f(...a));sv();return r}};
wrap('add',r=>'أضاف '+KS[r.kind]+': '+r.title);wrap('upd',(id,p)=>'حدّث السجل #'+id+' إلى '+(S[p.status]||p.status));wrap('del',id=>'حذف السجل #'+id);wrap('setM',()=>'عدّل صلاحيات عضو');
Object.assign(L,{all:async()=>mem.e.map(x=>({...x,profiles:mem.m.find(m=>m.id===x.user_id)})).reverse(),att:async()=>mem.att,addAtt:async(t,d,k)=>{mem.att.push({id:Date.now(),title:t,date:d,kind:k,marks:{}});lg('فتح جلسة حضور: '+t);sv()},mark:async(id,u,v)=>{mem.att.find(x=>x.id===id).marks[u]=v;lg('سجّل حضور');sv()},log:async()=>mem.log});
const ok=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const A=sb?{
 async me(){const s=(await sb.auth.getSession()).data.session;if(!s)return null;return ok(sb.from('profiles').select('*').eq('id',s.user.id).single())},
 login:async(u,p)=>{const r=await sb.auth.signInWithPassword({email:em(u),password:p});if(r.error)throw r.error},
 signup:async(u,p)=>{const r=await sb.auth.signUp({email:em(u),password:p,options:{data:{username:u}}});if(r.error)throw r.error},
 out:()=>sb.auth.signOut(),
 list(f){let q=sb.from('entries').select('*,profiles(username,display)').order('created_at',{ascending:false});if(f.kind)q=q.eq('kind',f.kind);if(f.uid)q=q.eq('user_id',f.uid);if(f.not)q=q.neq('user_id',f.not);if(f.st)q=q.in('status',f.st);return ok(q)},
 add:r=>ok(sb.from('entries').insert(r)),
 upd:(id,p)=>ok(sb.from('entries').update(p).eq('id',id)),
 del:id=>ok(sb.from('entries').delete().eq('id',id)),
 members:()=>ok(sb.from('profiles').select('*').order('created_at')),
 setM:(id,rk,st)=>ok(sb.rpc('set_member',{uid:id,new_rank:rk,new_status:st}))
}:L;
const root=document.getElementById('me'),box=document.getElementById('meBox');
let me=null,tab='report',rows=[],msg='',ax={},fk='';
const staff=()=>me&&(me.rank==='officer'||me.rank==='command');
const opts=(o,v)=>Object.keys(o).map(k=>`<option value="${k}"${k===v?' selected':''}>${o[k]}</option>`).join('');
const day=d=>d?new Date(d).toLocaleDateString('ar'):'';
async function attLoad(){ax={mem:(await A.members()).filter(m=>m.status==='active')};return A.att()}
async function adm(){ax={att:await A.att(),log:await A.log(),mem:(await A.members()).filter(m=>m.status==='active')};return A.all()}
async function load(){try{rows=tab==='att'?await attLoad():tab==='admin'?await adm():tab==='members'?await A.members():tab==='review'?(await A.list({not:me.id,st:['pending','submitted','open']})).filter(x=>x.kind!=='note'):await A.list({kind:tab,uid:me.id})}catch(e){rows=[];msg=er(e)}}
async function boot(){try{me=await A.me()}catch(_){me=null}msg='';if(me&&me.status==='active')await load();draw()}
async function go(t){tab=t;msg='';await load();draw()}
function card(r){const who=r.profiles?E(r.profiles.display||r.profiles.username):'';
 const mine=tab!=='review'&&tab!=='admin';const canDel=mine&&(r.kind==='note'||['pending','submitted','open'].includes(r.status));
 let h=`<article><header><b>${E(r.title)}</b><span class="st">${S[r.status]||E(r.status)}</span></header><small>${tab==='review'||tab==='admin'?who+' | '+KS[r.kind]+' | ':''}${day(r.created_at)}${r.kind==='leave'?' | من '+E(r.start_date)+' إلى '+E(r.end_date):''}</small>${r.body?`<p>${E(r.body)}</p>`:''}${r.review_note?`<p class="rv">ملاحظة المراجع: ${E(r.review_note)}</p>`:''}`;
 if(tab==='review'){const ok1=r.kind==='leave'?['approved','موافقة']:r.kind==='case'?['closed','إغلاق']:['reviewed','تمت المراجعة'];
  h+=`<input data-note="${r.id}" maxlength="500" placeholder="ملاحظة للعضو (اختياري)"><div class="r"><button class="pri" data-act="${r.id}|${ok1[0]}">${ok1[1]}</button><button data-act="${r.id}|rejected">رفض</button></div>`}
 if(canDel)h+=`<button data-del="${r.id}">حذف</button>`;
 return h+'</article>'}
function draw(){
 let h=sb?'':'<div class="demo">وضع تجربة: البيانات محفوظة بهذا المتصفح فقط، وتدخل كقيادة. اربط Supabase ليشتغل التسجيل والخصوصية بشكل حقيقي.</div>';
 if(!me){box.innerHTML=h+`<div class="mh"><b>حسابي</b><span class="sp"></span><button data-x="close">إغلاق</button></div><form id="lg"><input name="u" placeholder="اسم المستخدم (إنجليزي)" pattern="[A-Za-z0-9_]{3,20}" required autocomplete="username"><input name="p" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" minlength="8" required autocomplete="current-password"><div class="r"><button class="pri" data-m="in">دخول</button><button data-m="up">حساب جديد</button></div><p class="rv">${E(msg)}</p></form>`;return}
 h+=`<div class="mh"><b>${E(me.display||me.username)}</b><span class="st">${R[me.rank]}</span><span class="sp"></span><button data-x="out">خروج</button><button data-x="close">إغلاق</button></div>`;
 if(me.status!=='active'){box.innerHTML=h+`<div class="card"><p>${me.status==='pending'?'حسابك بانتظار موافقة القيادة.':'حسابك موقوف. تواصل مع القيادة.'}</p></div>`;return}
 const tabs=['report','case','leave','note'].concat(staff()?['review']:[]).concat(A.att?['att']:[]).concat(me.rank==='command'?['members']:[]).concat(A.all&&me.rank==='command'?['admin']:[]);
 h+=`<div class="tabs">${tabs.map(t=>`<button data-tab="${t}"${t===tab?' class="on"':''}>${K[t]}</button>`).join('')}</div>`;

const K={hr:'تقرير HR',complaint:'شكوى',presence:'تواجد',note:'ملاحظات'},ST={new:'جديد',reviewed:'تمت المراجعة',rejected:'مرفوض'};
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const AM={};'ضQصWثEقRفTغYعUهIخOحPشAسSيDبFلGاHتJنKمLئZءXؤCرVىNةM'.replace(/(.)([A-Z])/g,(m,a,b)=>(AM[a]=b,''));Object.assign(AM,{'أ':'H','إ':'Y','آ':'N','َ':'Q','ً':'W','ُ':'E','ٌ':'R','ِ':'A','ٍ':'S','ْ':'X','ـ':'J','؛':'P'});
/* يقبل الكود حتى لو انكتب بكيبورد عربي */
const n1=c=>String(c||'').replace(/ل([إأآ])/g,(m,x)=>({'إ':'T','أ':'G','آ':'B'}[x])).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).split('').map(ch=>AM[ch]||ch).join('').toUpperCase().replace(/[^A-Z0-9]/g,'');
const norm=n1;
const vars=s=>{s=String(s||'');const p=s.split('لا');if(p.length<2||p.length>5)return[n1(s)];let o=[n1(p[0])];for(let i=1;i<p.length;i++){const q=n1(p[i]);o=o.flatMap(x=>[x+'GH'+q,x+'B'+q])}return o};
function sha256(m){const b=new TextEncoder().encode(m),l=b.length,w=new Uint32Array(((l+72)>>6)<<4),r=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-8*(i&3));w[l>>2]|=128<<(24-8*(l&3));w[w.length-1]=l*8;
 const k=[],pr=[];for(let c=2;k.length<64;c++){if(pr.every(p=>c%p)){pr.push(c);k.push((Math.cbrt(c)%1*4294967296)|0)}}
 let H=[],q=[];for(let i=0;i<8;i++)H.push((Math.sqrt(pr[i])%1*4294967296)|0);
 for(let o=0;o<w.length;o+=16){const x=new Array(64);for(let i=0;i<16;i++)x[i]=w[o+i];
  for(let i=16;i<64;i++){const a=x[i-15],c=x[i-2];x[i]=(x[i-16]+(r(a,7)^r(a,18)^(a>>>3))+x[i-7]+(r(c,17)^r(c,19)^(c>>>10)))|0}
  let [a,b2,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+k[i]+x[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
  H=[a,b2,c,d,e,f,g,h].map((v,i)=>(H[i]+v)|0)}
 return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}
async function H(c){const t=norm(c);try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}}catch(_){}return sha256(t)}
const sb=(SB_URL&&SB_KEY&&window.supabase)?window.supabase.createClient(SB_URL,SB_KEY):null;
const rpc=async(f,a)=>{const r=await sb.rpc(f,a);if(r.error)throw r.error;return r.data};
const LK='psf_entries_v1',ld=()=>{try{return JSON.parse(localStorage.getItem(LK))||[]}catch(_){return[]}},sv=a=>localStorage.setItem(LK,JSON.stringify(a));
const API={
 async login(c){if(sb)return rpc('member_login',{c:norm(c)});const hs=await Promise.all(vars(c).map(H));if(hs.includes(ADM))return'ADMIN';return Object.keys(MEM).find(i=>hs.includes(MEM[i]))||null},
 async add(s,k,t,b,x){if(sb)return rpc('add_entry',{c:s.code,k,t,b,x});const a=ld();a.push({id:Date.now(),member_id:s.id,kind:k,title:t,body:b,extra:x,status:'new',review_note:null,created_at:new Date().toISOString()});sv(a)},
 async mine(s){return sb?rpc('my_entries',{c:s.code}):ld().filter(r=>r.member_id===s.id)},
 async all(s){return sb?rpc('admin_all',{c:s.code}):ld()},
 async set(s,i,st,n){if(sb)return rpc('admin_set',{c:s.code,i,s:st,n:n||''});const a=ld(),r=a.find(x=>x.id===i);if(r){r.status=st;r.review_note=n||null}sv(a)}
};
const css=document.getElementById('mecss').textContent.replace(/#meBtn/g,'#me2Btn').replace(/#meBox/g,'#me2Box').replace(/#me(?![A-Za-z0-9])/g,'#me2');
const sty=document.createElement('style');sty.textContent=css+'#me2Btn{inset-inline-end:auto;inset-inline-start:16px}#me2{z-index:9600}#me2 summary{cursor:pointer;margin:10px 0;color:var(--ac)}';document.head.appendChild(sty);const hid=document.createElement('style');hid.textContent='#meBtn,#memBtn,#me2Btn{display:none!important}';document.head.appendChild(hid);
document.body.insertAdjacentHTML('beforeend','<button id="me2Btn" type="button">🔑 بوابة الأعضاء</button><div id="me2" hidden><div id="me2Box"></div></div>');
const root=document.getElementById('me2'),box=document.getElementById('me2Box');
let S=null,tab='hr',rows=[],msg='',fk='',fm='',fs='';
let NM={};try{NM=JSON.parse(localStorage.getItem('psf_names_v1'))||{}}catch(_){}
const nm=id=>NM[id]?E(NM[id])+' ('+E(id)+')':E(id);
const enc=o=>'PSF1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))),dec=t=>JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))));
const day=d=>d?new Date(d).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'}):'';
const op=(o,v)=>Object.keys(o).map(k=>`<option value="${k}"${k===v?' selected':''}>${o[k]}</option>`).join('');
async function load(){try{rows=(S.id==='ADMIN'?await API.all(S):await API.mine(S))||[];rows=rows.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}catch(e){rows=[];msg='خطأ بالاتصال: '+(e.message||'')}}
const card=(r,a)=>`<article><header><b>${E(r.title)}</b><span class="st">${ST[r.status]||E(r.status)}</span></header><small>${a?nm(r.member_id)+' | ':''}${K[r.kind]||''} | ${day(r.created_at)}${r.extra?' | '+E(r.extra):''}</small>${r.body?`<p>${E(r.body)}</p>`:''}${r.review_note?`<p class="rv">ملاحظة الإدارة: ${E(r.review_note)}</p>`:''}${a?`<input data-n="${r.id}" maxlength="300" placeholder="ملاحظة للعضو (اختياري)"><div class="r"><button class="pri" data-s="${r.id}|reviewed">تمت المراجعة</button><button data-s="${r.id}|rejected">رفض</button></div>`:`${sb?'':`<button data-cp="${r.id}">نسخ للإرسال</button>`}`}</article>`;
function draw(){
 let h=sb||!S?'':(S.id==='ADMIN'?'<div class="demo">استورد تقارير الأعضاء: الصق النص اللي بيوصلك منهم بالخانة تحت.</div>':'<div class="demo">تقريرك بينحفظ على جهازك. بعد الإرسال اضغط «نسخ للإرسال» وابعته للقيادة.</div>');
 if(!S){box.innerHTML=h+'<div class="mh"><b>بوابة الأعضاء</b><small>نسخة 8</small><span class="sp"></span><button data-x="close">إغلاق</button></div><form id="lg"><label>كودك الخاص</label><input name="c" type="text" dir="ltr" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" required placeholder="XXXX-XXXX-XXXX"><button class="pri">دخول</button></form>'+(msg?`<p class="rv">${E(msg)}</p>`:'');return}
 const adm=S.id==='ADMIN';
 h+=`<div class="mh"><b>${adm?'لوحة تحكم التقارير':'صفحة العضو '+E(S.id)}</b><span class="sp"></span><button data-x="out">خروج</button><button data-x="close">إغلاق</button></div>`;
 if(msg)h+=`<p class="rv">${E(msg)}</p>`;
 if(adm){
  const c=k=>rows.filter(r=>r.kind===k).length,ms=[...new Set(rows.map(r=>r.member_id))].sort();
  h+='<div class="tiles">'+[['الكل',rows.length],['جديد',rows.filter(r=>r.status==='new').length]].concat(Object.keys(K).map(k=>[K[k],c(k)])).map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')+'</div>';
  const hrs=r=>{const m=/المدة: ([\d.]+)/.exec(r.extra||'');return m?+m[1]:0},ids=Object.keys(MEM);
  h+='<article><b>ملخص الأعضاء</b><div class="tw"><table><tr><th>العضو</th><th>HR</th><th>شكاوى</th><th>ساعات التواجد</th><th>ملاحظات</th><th>آخر نشاط</th></tr>'+ids.map(id=>{const m=rows.filter(r=>r.member_id===id),l=m[0],n=k=>m.filter(r=>r.kind===k).length;return `<tr><td>${nm(id)}</td><td>${n('hr')}</td><td>${n('complaint')}</td><td>${m.filter(r=>r.kind==='presence').reduce((t,r)=>t+hrs(r),0)}</td><td>${n('note')}</td><td>${l?day(l.created_at):'-'}</td></tr>`}).join('')+'</table></div></article>';
  h+='<details><summary>أسماء الأعضاء (اكتب اسم كل عضو ليظهر بالتقارير)</summary>'+ids.map(id=>`<input data-nm="${id}" maxlength="40" placeholder="${id}" value="${E(NM[id]||'')}">`).join('')+'</details>';
  if(!sb)h+='<form id="imp"><textarea name="x" rows="3" placeholder="الصق التقارير هنا (كل تقرير بسطر)"></textarea><button class="pri">استيراد</button></form>';
  h+=`<div class="r"><select id="fk"><option value="">كل الأنواع</option>${op(K,fk)}</select><select id="fm"><option value="">كل الأعضاء</option>${ms.map(m=>`<option value="${E(m)}"${m===fm?' selected':''}>${nm(m)}</option>`).join('')}</select><select id="fs"><option value="">كل الحالات</option>${op(ST,fs)}</select></div>`;
  const f=rows.filter(r=>(!fk||r.kind===fk)&&(!fm||r.member_id===fm)&&(!fs||r.status===fs));
  h+=f.length?f.map(r=>card(r,1)).join(''):'<p><small>ما في سجلات.</small></p>';
 }else{
  h+=`<div class="tabs">${Object.keys(K).map(k=>`<button data-tab="${k}"${k===tab?' class="on"':''}>${K[k]}</button>`).join('')}</div>`;
  h+=`<form id="f"><input name="t" required maxlength="120" placeholder="العنوان">${tab==='presence'?'<div class="r"><input type="date" name="d" required><input type="number" name="hrs" min="0.5" max="24" step="0.5" placeholder="عدد الساعات" required></div>':''}<textarea name="b" rows="4" maxlength="4000" placeholder="${tab==='note'?'ملاحظاتك':'التفاصيل'}"></textarea><button class="pri">إرسال ${K[tab]}</button></form>`;
  const m=rows.filter(r=>r.kind===tab);h+=m.length?m.map(r=>card(r,0)).join(''):'<p><small>ما في سجلات لسه.</small></p>';
 }
 box.innerHTML=h}
box.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.x==='close'){root.hidden=true;return}
 if(d.x==='out'){S=null;msg='';rows=[];return draw()}
 if(d.tab){tab=d.tab;msg='';return draw()}
 if(d.cp){const r=rows.find(x=>String(x.id)===d.cp);if(r){const tx=enc({i:r.id,m:r.member_id,k:r.kind,t:r.title,b:r.body,x:r.extra,d:r.created_at});try{await navigator.clipboard.writeText(tx);msg='تم النسخ ✓ الصقه وابعته للقيادة'}catch(_){prompt('انسخ هالنص وابعته للقيادة',tx)}draw()}return}
 if(d.s){const p=d.s.split('|'),i=box.querySelector(`[data-n="${p[0]}"]`);try{await API.set(S,+p[0],p[1],i&&i.value.trim());await load()}catch(er){msg=er.message||'صار خطأ'}draw()}};
box.onsubmit=async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 try{
  if(f.id==='lg'){const id=await API.login(d.c);if(!id){const q=vars(d.c)[0];msg='الكود غير صحيح. الموقع قرأ: '+q+' ('+q.length+' خانة من 12).';return draw()}S={id,code:norm(d.c)};msg='';await load();return draw()}
  if(f.id==='imp'){let ok=0,dup=0,bad=0;const a=ld();for(const ln of(d.x||'').split(/\s+/).filter(Boolean)){try{if(!ln.startsWith('PSF1:'))throw 0;const o=dec(ln);if(!MEM[o.m]||!K[o.k]||!o.t)throw 0;const u=o.m+'#'+o.i;if(a.some(r=>r.src===u)){dup++;continue}a.push({id:Date.now()+ok,src:u,member_id:o.m,kind:o.k,title:String(o.t).slice(0,120),body:String(o.b||'').slice(0,4000),extra:String(o.x||'').slice(0,100),status:'new',review_note:null,created_at:o.d||new Date().toISOString()});ok++}catch(_){bad++}}sv(a);msg='تم استيراد '+ok+(dup?' | مكرر '+dup:'')+(bad?' | غير صالح '+bad:'');await load();return draw()}
  await API.add(S,tab,d.t.trim(),(d.b||'').trim(),tab==='presence'?`التاريخ: ${d.d} | المدة: ${d.hrs} ساعة`:'');msg='تم الإرسال ✓';await load();draw()
 }catch(er){msg=er.message||'صار خطأ';draw()}};
box.onchange=e=>{const t=e.target;if(t.dataset&&t.dataset.nm){NM[t.dataset.nm]=t.value.trim();try{localStorage.setItem('psf_names_v1',JSON.stringify(NM))}catch(_){}msg='تم حفظ الاسم ✓';return}if(t.id==='fk')fk=t.value;else if(t.id==='fm')fm=t.value;else if(t.id==='fs')fs=t.value;else return;draw()};
const lk=document.getElementById('lockBtn');if(lk){const b2=document.createElement('button');b2.className='tb wide';b2.textContent='🔑 بوابة الأعضاء';b2.onclick=()=>{root.hidden=false;draw()};lk.after(b2)}
document.getElementById('me2Btn').onclick=()=>{root.hidden=false;draw()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!root.hidden)root.hidden=true});
})();
</script>
